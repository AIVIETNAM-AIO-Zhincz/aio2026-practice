name: Budget Planner CI

on:
  push:
    branches: [develop, production]
    paths:
      - "conquer/budget-planner/**"
      - ".github/workflows/budget-planner.yml"
  pull_request:
    paths:
      - "conquer/budget-planner/**"

defaults:
  run:
    working-directory: conquer/budget-planner/backend

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Verify Alembic migration applies
        env:
          BP_DATABASE_URL: sqlite:///./ci.db
        run: alembic upgrade head

      - name: Run tests (pytest, TDD)
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t budget-planner-backend .
