[pytest]
# Cấu hình RIÊNG cho khu luyện tập DSA — chạy độc lập với gate coverage
# của aiolib ở pyproject.toml gốc. Khi chạy `pytest` bên trong thư mục
# dsa-practice/, pytest dùng file này làm rootdir nên KHÔNG áp --cov.
testpaths = .
python_files = test_*.py
python_functions = test_*
addopts = -q
