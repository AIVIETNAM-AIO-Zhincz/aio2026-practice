# Pre-commit hooks — chặn lỗi ngay tại local trước khi commit.
# Cài 1 lần: pip install pre-commit && pre-commit install
# Chạy thủ công toàn repo: pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff           # linter (tự sửa được thì --fix)
        args: [--fix]
      - id: ruff-format    # formatter (tương thích Black)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy           # kiểm type tĩnh cho thư viện aiolib
        files: ^aiolib/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
