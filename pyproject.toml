[project]
name = "aio2026-practice"
version = "0.1.0"
description = "Code thực hành khoá AI Việt Nam — AIO 2026 + project AIO Conquer 2026"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: flake8-bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = []

# Format dùng `ruff format` (tương thích Black, cùng line-length 100) — một formatter duy nhất.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
# Bắt buộc type hint cho mọi hàm (theo constitution & CLAUDE.md)
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Test dùng hàm test_* không cần type hint
module = "tests.*"
disallow_untyped_defs = false
